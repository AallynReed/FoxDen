[package]
name = "foxden-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "foxden-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"
winresource = "0.1"

[dependencies]
tauri = { path = "host", package = "foxden-host" }
tauri-plugin-notification = { path = "notify", package = "foxden-notify" }
foxden-core.workspace = true
foxden-openrgb = { path = "../crates/foxden-openrgb" }
foxden-hid = { path = "../crates/foxden-hid" }
foxden-smbus = { path = "../crates/foxden-smbus" }
foxden-superio = { path = "../crates/foxden-superio" }
foxden-wmi = { path = "../crates/foxden-wmi" }
foxden-adlx = { path = "../crates/foxden-adlx" }
foxden-gpu = { path = "../crates/foxden-gpu" }
foxden-audio = { path = "../crates/foxden-audio" }
foxden-screen = { path = "../crates/foxden-screen" }
foxden-fan = { path = "../crates/foxden-fan" }
foxden-client = { path = "../crates/foxden-client" }
foxden-net = { path = "../crates/foxden-net" }
foxden-xpack = { path = "../crates/foxden-xpack" }
foxden-battery = { path = "../crates/foxden-battery" }
foxden-headset = { path = "../crates/foxden-headset" }
foxden-mixer = { path = "../crates/foxden-mixer" }
foxden-vcable = { path = "../crates/foxden-vcable" }
base64 = "0.21"
serde.workspace = true
serde_json.workspace = true
tray-icon = "0.25"
wmi = { version = "0.18", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
windows-service = "0.8"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
