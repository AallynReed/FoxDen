name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CACHE_PATHS: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        target
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Rust version
        id: rustc
        run: |
          "version=$((rustc --version).Split()[1])" >> $env:GITHUB_OUTPUT

      # Releases build without the cache.
      - name: Restore cache
        id: cache
        if: github.ref_type == 'branch'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_PATHS }}
          key: cargo-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ steps.rustc.outputs.version }}-

      # Releases are tested and linted on the release PC before tagging.
      - name: Test
        if: github.ref_type != 'tag'
        run: cargo test --workspace --locked

      - name: Lint
        if: github.ref_type != 'tag'
        run: cargo clippy --workspace --all-targets

      - name: Download PawnIO
        run: |
          Invoke-WebRequest https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe -OutFile packaging/PawnIO_setup.exe
          if ((Get-FileHash packaging/PawnIO_setup.exe).Hash -ne '1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032') { throw 'PawnIO_setup.exe hash mismatch' }

      - name: Compile app
        run: cargo build --release --locked -p foxden-native -p foxden-service

      - name: Compile installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $makensis = (Get-Command makensis -ErrorAction Ignore).Source
          if (-not $makensis) {
            choco install nsis --no-progress -y
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'foxden-native' | Select-Object -ExpandProperty version
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = "$PWD\dist\FoxDen_${version}_x64-setup.exe"
          & $makensis -V2 "/DVERSION=$version" "/DAPP=$PWD\target\release\foxden-native.exe" "/DSERVICE=$PWD\target\release\foxden-service.exe" "/DPAWNIO=$PWD\packaging\PawnIO_setup.exe" "/DOUT=$setup" packaging\native.nsi
          if ($LASTEXITCODE) { throw 'makensis failed' }
          npx --yes "@tauri-apps/cli@2.12.4" signer sign $setup
          if ($LASTEXITCODE) { throw 'signing failed' }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: FoxDen-setup
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sig
          if-no-files-found: error

      - name: Save cache
        if: github.ref_type == 'branch' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
