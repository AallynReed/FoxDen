name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CACHE_PATHS: |
        ~/.cargo/registry/index
        ~/.cargo/registry/cache
        target
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Rust version
        id: rustc
        run: |
          "version=$((rustc --version).Split()[1])" >> $env:GITHUB_OUTPUT

      # Releases build without the cache.
      - name: Restore cache
        id: cache
        if: github.ref_type == 'branch'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_PATHS }}
          key: cargo-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ steps.rustc.outputs.version }}-

      - name: Test
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets

      - name: Compile installer
        run: |
          Remove-Item target/release/bundle -Recurse -Force -ErrorAction Ignore
          npx --yes "@tauri-apps/cli@2.12.4" build --config packaging/tauri.bundle.json

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: FoxRGB-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Save cache
        if: github.ref_type == 'branch' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
