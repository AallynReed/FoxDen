name: Release

# Pushing a tag such as v0.1.0 builds the installer here and drafts a release that carries it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check that the tag names the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(jq -r .version src-tauri/tauri.conf.json)"
          crates="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ "$tag" != "$app" ] || [ "$tag" != "$crates" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the code: $app in tauri.conf.json, $crates in Cargo.toml."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FoxRGB-setup

      # A draft: it becomes public only when published by hand.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -- *-setup.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *-setup.exe SHA256SUMS.txt \
            --draft --verify-tag --generate-notes --title "FoxRGB ${GITHUB_REF_NAME#v}"
