name: Release
run-name: Compile installer

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          app="$(jq -r .version src-tauri/tauri.conf.json)"
          crates="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ "$tag" != "$app" ] || [ "$tag" != "$crates" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $app"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: FoxRGB-setup

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release list --json tagName --jq '.[].tagName' | grep -qxF "$GITHUB_REF_NAME"; then
            echo "::error::Release $GITHUB_REF_NAME already exists"
            exit 1
          fi
          sha256sum -- *-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          file="$(echo *-setup.exe)"
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg sig "$(cat "$file.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME/$file" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          gh release create "$GITHUB_REF_NAME" "$file" "$file.sig" latest.json SHA256SUMS.txt \
            --draft --verify-tag --generate-notes --title "FoxRGB ${GITHUB_REF_NAME#v}"
