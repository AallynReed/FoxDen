name: Download count
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  count:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Count installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          n=$(gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].assets[] | select(.name | endswith(".exe")) | .download_count' | awk '{s+=$1} END {print s+0}')
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"brightgreen"}' "$n" > site/downloads.json
          cat site/downloads.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
