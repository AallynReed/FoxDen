name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FoxDen version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows
      options: [Windows 11, Windows 10]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Lighting, Fans, Installer, Updates, Interface, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Anything from the log window, or screenshots.
      render: text
