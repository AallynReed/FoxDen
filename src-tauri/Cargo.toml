[package]
name = "foxrgb"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
foxrgb-core.workspace = true
foxrgb-openrgb = { path = "../crates/foxrgb-openrgb" }
foxrgb-hid = { path = "../crates/foxrgb-hid" }
foxrgb-smbus = { path = "../crates/foxrgb-smbus" }
foxrgb-adlx = { path = "../crates/foxrgb-adlx" }
foxrgb-gpu = { path = "../crates/foxrgb-gpu" }
foxrgb-audio = { path = "../crates/foxrgb-audio" }
foxrgb-screen = { path = "../crates/foxrgb-screen" }
foxrgb-fan = { path = "../crates/foxrgb-fan" }
foxrgb-client = { path = "../crates/foxrgb-client" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
wmi = { version = "0.18", default-features = false }
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
