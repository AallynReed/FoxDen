[package]
name = "foxden"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
foxden-core.workspace = true
foxden-openrgb = { path = "../crates/foxden-openrgb" }
foxden-hid = { path = "../crates/foxden-hid" }
foxden-smbus = { path = "../crates/foxden-smbus" }
foxden-superio = { path = "../crates/foxden-superio" }
foxden-wmi = { path = "../crates/foxden-wmi" }
foxden-adlx = { path = "../crates/foxden-adlx" }
foxden-gpu = { path = "../crates/foxden-gpu" }
foxden-audio = { path = "../crates/foxden-audio" }
foxden-screen = { path = "../crates/foxden-screen" }
foxden-fan = { path = "../crates/foxden-fan" }
foxden-client = { path = "../crates/foxden-client" }
foxden-net = { path = "../crates/foxden-net" }
foxden-xpack = { path = "../crates/foxden-xpack" }
foxden-battery = { path = "../crates/foxden-battery" }
steelseries-gg = { path = "../crates/steelseries-gg", features = ["audio"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tray-icon = "0.25"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
wmi = { version = "0.18", default-features = false }
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
