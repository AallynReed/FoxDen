<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>FoxDen logs</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="logs.css" />
  </head>
  <body class="logs">
    <h1 class="sr-only">FoxDen logs</h1>
    <div class="bar logs-tools">
      <div class="seg" role="radiogroup" aria-label="Show">
        <button type="button" role="radio" data-level="info" aria-checked="true">All</button>
        <button type="button" role="radio" data-level="warn" aria-checked="false">Warnings</button>
        <button type="button" role="radio" data-level="error" aria-checked="false">Errors</button>
      </div>
      <input type="text" id="filter" placeholder="Filter" aria-label="Filter" autocomplete="off" spellcheck="false" />
      <span class="grow" id="count" role="status"></span>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <ol class="log" id="log" tabindex="0" aria-label="Log entries"></ol>
    <p class="hint empty" id="empty" hidden>Nothing logged yet.</p>
    <script src="frame.js"></script>
    <script src="logs.js"></script>
  </body>
</html>
