[package]
name = "foxrgb-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
foxrgb-fan = { path = "../foxrgb-fan" }
foxrgb-hid = { path = "../foxrgb-hid" }
foxrgb-hwmon = { path = "../foxrgb-hwmon" }
foxrgb-core.workspace = true
foxrgb-smbus = { path = "../foxrgb-smbus" }
foxrgb-superio = { path = "../foxrgb-superio" }
foxrgb-wmi = { path = "../foxrgb-wmi" }
foxrgb-xpack = { path = "../foxrgb-xpack" }
serde.workspace = true
serde_json.workspace = true
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
