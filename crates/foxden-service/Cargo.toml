[package]
name = "foxden-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
foxden-fan = { path = "../foxden-fan" }
foxden-hid = { path = "../foxden-hid" }
foxden-hwmon = { path = "../foxden-hwmon" }
foxden-core.workspace = true
foxden-smbus = { path = "../foxden-smbus" }
foxden-vcable = { path = "../foxden-vcable" }
foxden-superio = { path = "../foxden-superio" }
foxden-wmi = { path = "../foxden-wmi" }
foxden-xpack = { path = "../foxden-xpack" }
serde.workspace = true
serde_json.workspace = true
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
