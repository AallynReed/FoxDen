[workspace]
resolver = "3"
members = ["crates/*", "native", "native/host", "native/host-macros", "native/notify"]

[workspace.package]
version = "0.21.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
foxden-core = { path = "crates/foxden-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keeps target/ small: full debug info is most of its size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# DeepFilterNet's models fail tract's debug checks and run too slowly unoptimized.
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false

[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Creating a context lists no devices once discovery is switched off, on Windows too.
[patch.crates-io]
hidapi = { path = "vendor/hidapi" }
