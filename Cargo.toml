[workspace]
resolver = "3"
members = ["crates/*", "native", "native/host", "native/host-macros", "native/notify"]

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
foxden-core = { path = "crates/foxden-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keeps target/ small: full debug info is most of its size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Creating a context lists no devices once discovery is switched off, on Windows too.
[patch.crates-io]
hidapi = { path = "vendor/hidapi" }
