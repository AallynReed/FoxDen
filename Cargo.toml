[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.17.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
foxden-core = { path = "crates/foxden-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Creating a context lists no devices once discovery is switched off, on Windows too.
[patch.crates-io]
hidapi = { path = "vendor/hidapi" }
